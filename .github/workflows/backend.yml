name: Backend checks and deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: sk_portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sk_portal_test
      DB_USERNAME: root
      DB_PASSWORD: ci_password
      DB_COLLATION: utf8mb4_unicode_ci
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, dom, xml, curl, fileinfo
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Create Laravel runtime directories
        run: mkdir -p bootstrap/cache storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP syntax
        run: find app bootstrap config database routes tests -name '*.php' -not -path 'bootstrap/cache/*' -print0 | xargs -0 -n1 php -l

      - name: Prepare isolated CI database
        run: php artisan migrate --seed --force

      - name: Run tests
        run: php vendor/bin/phpunit

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: backend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Pull tested changes on server
        shell: bash
        env:
          GODADDY_HOST: ${{ secrets.GODADDY_HOST }}
          GODADDY_PORT: ${{ secrets.GODADDY_PORT }}
          GODADDY_USER: ${{ secrets.GODADDY_USER }}
          GODADDY_SSH_KEY: ${{ secrets.GODADDY_SSH_KEY }}
          GODADDY_DEPLOY_PATH: ${{ secrets.GODADDY_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${GODADDY_HOST:?Set GODADDY_HOST}"
          : "${GODADDY_USER:?Set GODADDY_USER}"
          : "${GODADDY_SSH_KEY:?Set GODADDY_SSH_KEY}"
          : "${GODADDY_DEPLOY_PATH:?Set GODADDY_DEPLOY_PATH}"
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          printf '%s\n' "$GODADDY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          ssh-keyscan -T 20 -p "${GODADDY_PORT:-22}" -H "$GODADDY_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          printf -v remote_command 'bash -s -- %q %q' "$GODADDY_DEPLOY_PATH" "$GITHUB_SHA"
          ssh -i ~/.ssh/deploy_key -p "${GODADDY_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$GODADDY_USER@$GODADDY_HOST" "$remote_command" < deploy/deploy.sh

      - name: Check deployed API
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 https://sk-portal.be.asc-nest.org/up
